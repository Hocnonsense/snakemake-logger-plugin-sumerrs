name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # release-type: python updates the version in pyproject.toml,
          # generates CHANGELOG.md, creates the release PR and the tag.
          # Use a dedicated PAT instead of GITHUB_TOKEN if the release PR
          # should itself trigger CI on `main`.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}

      - name: Install Pixi
        if: ${{ steps.release.outputs.release_created }}
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: publish
          cache: true

      - name: Build and check package
        if: ${{ steps.release.outputs.release_created }}
        run: pixi run --environment publish check

      - name: Publish to PyPI
        if: ${{ steps.release.outputs.release_created }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }}
